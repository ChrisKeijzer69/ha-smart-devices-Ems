name: Release

# Een tag vX.Y.Z pushen maakt een GitHub-release, zodat HACS een versienummer
# toont in plaats van een commit. De tag moet gelijk zijn aan de versie in
# manifest.json (en dus aan VERSIE in const.py, zie tests/test_kaart.py).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag gelijk aan manifest
        run: |
          versie=$(python3 -c "import json;print(json.load(open('custom_components/smart_devices_ems/manifest.json'))['version'])")
          test "v$versie" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, manifest $versie"; exit 1; }
      - name: Release maken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # De releasetekst is de tekst van de (geannoteerde) tag.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)')
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "${notes:-Versie $GITHUB_REF_NAME}"
